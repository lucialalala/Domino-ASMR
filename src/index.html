<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <title>多米诺ASMR · 慢慢排，轻轻倒</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <main id="app">
    <div id="stage" aria-label="多米诺建造区，按住并滑动摆放骨牌">
      <canvas id="ground" aria-hidden="true"></canvas>
      <canvas id="scene" aria-label="三维多米诺画布"></canvas>
      <canvas id="fallback" hidden aria-label="多米诺兼容画布"></canvas>
      <canvas id="overlay" aria-hidden="true"></canvas>
    </div>
    <header class="header" id="header">
      <div class="identity">
        <div class="brand" aria-hidden="true"><i></i><i></i><i></i></div>
        <div><p class="eyebrow">A LITTLE MOMENT OF CALM</p><h1>多米诺ASMR</h1></div>
      </div>
      <button id="sound" class="sound-button" type="button" aria-label="关闭声音" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-waves" d="M15 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/><path class="sound-off" d="m16 9 6 6m0-6-6 6"/></svg>
        <span id="sound-label">声音已开</span>
      </button>
    </header>
    <section class="intro" id="intro" aria-label="玩法提示">
      <p class="intro-kicker">慢慢排，轻轻倒</p>
      <h2>画一条彩虹，<br>听它轻轻落下。</h2>
      <p class="intro-copy">按住画面滑动，就从一张开始。</p>
    </section>
    <div class="counter" aria-label="骨牌数量"><span class="counter-dot"></span><strong id="count">0</strong><span>/ 400 张</span></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <footer class="footer" id="footer">
      <div class="status-row"><span id="phase">自由建造</span><span class="status-separator"></span><span id="hint">滑动摆放，点击推倒</span></div>
      <div class="toolbar">
        <button id="undo" class="tool-button" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5-5 5 5 5M3 10h10a6 6 0 0 1 0 12" transform="translate(1 -2)"/></svg><span>撤销</span></button>
        <button id="play" class="play-button" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg><span id="play-label">推倒彩虹</span></button>
        <button id="clear" class="tool-button" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></svg><span>清空</span></button>
      </div>
      <p class="footnote"><span class="tiny-rainbow" aria-hidden="true"></span>没有终点，只有下一种颜色。</p>
    </footer>
    <div id="pause-panel" class="scrim" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="pause-title"><p class="eyebrow">TAKE YOUR TIME</p><h2 id="pause-title">彩虹还在这里。</h2><p>准备好后，接着刚才的片刻。</p><button id="resume" type="button" class="dialog-primary">继续</button></section></div>
    <div id="clear-panel" class="scrim" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="clear-title"><p class="eyebrow">A FRESH START</p><h2 id="clear-title">重新画一条？</h2><p>这条彩虹会被清空。</p><div class="dialog-actions"><button id="cancel-clear" type="button">再看看</button><button id="confirm-clear" type="button" class="dialog-primary">清空画面</button></div></section></div>
    <noscript>请启用 JavaScript 后体验多米诺ASMR。</noscript>
  </main>
  <script src="./assets/config.js"></script>
  <script src="./assets/math.js"></script>
  <script src="./assets/path.js"></script>
  <script src="./assets/simulation.js"></script>
  <script src="./assets/camera.js"></script>
  <script src="./assets/renderer.js"></script>
  <script src="./assets/audio.js"></script>
  <script src="./assets/platform.js"></script>
  <script src="./assets/main.js"></script>
</body>
</html>
